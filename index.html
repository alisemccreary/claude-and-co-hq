<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude &amp; Co. — Studio HQ</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2f4739">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio HQ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f4739'/><text x='50' y='70' font-size='54' text-anchor='middle' fill='%23f0b6c0' font-family='Georgia' font-style='italic' font-weight='bold'>cl</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- ============ ACCESS GATE ============ -->
<div id="gate" class="gate hidden">
  <div class="gate-card">
    <div class="gate-logo">cl<span>.</span></div>
    <h1>Claude &amp; Co.</h1>
    <p class="gate-sub">Studio HQ</p>
    <input type="password" id="gate-input" placeholder="Studio password" autocomplete="off" enterkeyhint="go">
    <button id="gate-btn" class="btn btn-primary btn-block">Come on in</button>
    <p id="gate-err" class="gate-err hidden">That's not it — ask Alise for the password.</p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app hidden">

  <!-- sidebar (desktop) / bottom bar (mobile) -->
  <nav class="nav" id="nav">
    <div class="nav-brand">
      <span class="nav-logo">cl<span>.</span></span>
      <span class="nav-brand-text">
        <b>Claude &amp; Co.</b>
        <i>Studio HQ</i>
      </span>
    </div>
    <div class="nav-items" id="nav-items"></div>
    <div class="nav-foot" id="nav-foot"></div>
  </nav>

  <!-- main -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn nav-back hidden" id="back-btn" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 class="topbar-title" id="topbar-title">Today</h1>
      <div class="topbar-search">
        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="search" placeholder="Search clients, tasks, people…" autocomplete="off">
        <kbd class="search-kbd">/</kbd>
      </div>
      <div class="topbar-right">
        <button class="icon-btn only-mobile" id="search-btn" aria-label="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <div class="who-wrap" id="who-wrap"></div>
        <button class="btn btn-ghost-line btn-sm" id="owner-btn">Owner login</button>
      </div>
    </header>

    <div id="owner-bar" class="owner-bar hidden">
      <span class="owner-bar-text"><span class="live-dot"></span><span id="owner-bar-label">Owner mode — changes save live for the team.</span></span>
      <span class="owner-bar-actions">
        <button class="btn btn-dark btn-sm" id="settings-btn">Settings</button>
        <button class="btn btn-ghost-dark btn-sm" id="lock-btn">Lock</button>
      </span>
    </div>

    <main class="content" id="content">
      <div class="skeleton-wrap" id="skeleton">
        <div class="sk sk-title"></div>
        <div class="sk-row"><div class="sk sk-tile"></div><div class="sk sk-tile"></div><div class="sk sk-tile"></div><div class="sk sk-tile"></div></div>
        <div class="sk sk-bar"></div><div class="sk sk-bar"></div>
        <div class="sk sk-card"></div><div class="sk sk-card"></div>
      </div>
      <section id="view" class="view hidden"></section>
    </main>
  </div>

  <button class="fab hidden" id="fab" aria-label="New task">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<!-- ============ SEARCH OVERLAY (mobile) ============ -->
<div id="search-overlay" class="search-overlay hidden">
  <div class="search-overlay-bar">
    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" id="search-mobile" placeholder="Search…" autocomplete="off">
    <button class="btn btn-ghost btn-sm" id="search-close">Cancel</button>
  </div>
  <div id="search-results" class="search-results"></div>
</div>

<!-- ============ MODAL ============ -->
<div id="modal-backdrop" class="modal-backdrop hidden">
  <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
</div>

<div id="toast-host" class="toast-host"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
